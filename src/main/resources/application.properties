server.port=${PORT:8080}

# Database: auto-detects MySQL or embedded H2 depending on URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/freelancehub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET:4b6f7a4e5234567890abcdef1234567890abcdef1234567890abcdef12345678}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration